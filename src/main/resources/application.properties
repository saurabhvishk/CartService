spring.application.name=CartService
server.port=8081

# MongoDB (Docker)
spring.data.mongodb.uri=mongodb://localhost:27017/cart_service
spring.data.mongodb.auto-index-creation=true

# Redis (Docker)
spring.data.redis.host=localhost
spring.data.redis.port=6379
# give up on Redis after 2s and use MongoDB instead
spring.data.redis.timeout=2s
# how long a cart copy stays in Redis
cart.cache.ttl-minutes=10

# Other services
services.auth.url=http://localhost:9000
services.product.url=http://localhost:8080


